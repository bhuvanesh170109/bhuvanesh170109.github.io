
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhuvanesh | My World</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10091f;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      color: #d8b4fe;
      font-weight: bold;
    }
    section {
      padding: 55px 20px;
    }
    h1 {
      font-size: 42px;
      color: #c084fc;
    }
    p {
      line-height: 1.8;
      color: #e9d5ff;

    .card {
      margin: 20px auto;
      padding: 20px;
      max-width: 400px;
      background: #25183a;
      border-radius: 18px;
    }
    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 25px;
      background: #9333ea;
      color: white;
      text-decoration: none;
    }
    footer {
      padding: 20px;
      color: #d8b4fe;

<body>
  <header>💜 BHUVANESH 💜</header>

  <section>
    <h1>Hey, I'm Bhuvanesh!</h1>
    <p>Welcome to my little world ✨</p>
    <a href="#about">Discover My World</a>
  </section>

  <section id="about">
    <div class="card">
      <h2>About Me 🌙</h2>
      <p>I'm Bhuvanesh. I love creativity, anime, technology, and learning new things.</p>
    </div>

    <div class="card">
      <h2>My Dreams 🚀</h2>
      <p>I'm learning, growing, and building my future one step at a time.</p>
    </div>

  <footer>Made with 💜 by Bhuvanesh</footer>
